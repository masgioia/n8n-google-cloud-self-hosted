services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.43.6
    container_name: n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Europe/Rome}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Europe/Rome}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_RUNNERS_ENABLED: "true"
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
    name: n8n_data
